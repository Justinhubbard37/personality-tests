<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personality Profile</title>
<style>
:root{
  color-scheme:dark;
  --black:#000000;
  --graphite:#363543;
  --cloudy:#5994d7;
  --azure:#e1f5f9;
  --pearl:#a1a1aa;
  --mint:#20bd90;
  --gunpowder:#4a4958;
  --steel:#1f1e2a;
  --amber:#fa3205;

  --bg:var(--black);
  --card:var(--steel);
  --text:var(--azure);
  --muted:var(--pearl);
  --line:var(--gunpowder);
  --accent:var(--mint);
  --section:var(--cloudy);
  --surface:var(--graphite);
  --soft:#292837;
}
*{box-sizing:border-box}
html,body{min-height:100%;background:var(--bg)}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.app{max-width:920px;margin:0 auto;padding:28px 20px 50px}
header{margin-bottom:18px}
h1{font-size:28px;margin:0 0 6px;color:var(--text)}
.subtitle{color:var(--muted);font-size:14px}

.tabs{display:flex;gap:8px;overflow:auto;padding:6px 0 18px}
button{font:inherit;color:var(--text);appearance:none;-webkit-appearance:none}
.tab{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  padding:11px 16px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  transition:background .16s,border-color .16s,color .16s,transform .16s;
}
.tab:hover{border-color:var(--cloudy);background:#403f50}
.tab.active{
  background:var(--mint);
  color:var(--black);
  border-color:var(--mint);
}
.tab:focus-visible,.option:focus-visible,.btn:focus-visible{
  outline:3px solid var(--cloudy);
  outline-offset:2px;
}

.panel{display:none}.panel.active{display:block}
.test-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}
.test-title{font-size:20px;font-weight:800;color:var(--cloudy)}
.test-note{color:var(--muted);font-size:13px;margin-top:4px;max-width:680px}

.progress{
  height:8px;
  background:var(--steel);
  border:1px solid var(--line);
  border-radius:999px;
  overflow:hidden;
  margin:12px 0 18px;
}
.progress>span{display:block;height:100%;background:var(--mint);width:0}

.card{
  background:var(--card);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:18px;
  padding:28px;
  box-shadow:0 12px 34px rgba(0,0,0,.34);
}
.card-top{display:flex;justify-content:flex-end;margin-bottom:20px}
.counter{font-weight:800;color:var(--cloudy);font-size:14px}
.question{font-size:24px;line-height:1.35;font-weight:750;margin:0 0 26px;color:var(--text)}

.options{display:grid;gap:10px}
.option{
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  border-radius:12px;
  padding:13px 14px;
  cursor:pointer;
  text-align:left;
  font-size:15px;
  transition:background .16s,border-color .16s,color .16s;
}
.option:hover{
  border-color:var(--cloudy);
  background:#403f50;
  color:var(--azure);
}
.option.selected{
  border-color:var(--mint);
  background:var(--soft);
  color:var(--azure);
}
.dot{
  width:18px;
  height:18px;
  border-radius:50%;
  border:2px solid var(--pearl);
  display:inline-block;
  flex:0 0 auto;
  background:transparent;
}
.selected .dot{border:6px solid var(--mint);background:var(--black)}

.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.btn{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  border-radius:10px;
  padding:10px 16px;
  font-weight:700;
  cursor:pointer;
  transition:background .16s,border-color .16s,color .16s;
}
.btn:hover:not(:disabled){border-color:var(--cloudy);background:#403f50}
.btn.primary{
  background:var(--mint);
  color:var(--black);
  border-color:var(--mint);
}
.btn.primary:hover:not(:disabled){background:#27c99b;border-color:#27c99b;color:var(--black)}
.btn:disabled{
  opacity:.48;
  cursor:not-allowed;
  color:var(--pearl);
  background:var(--steel);
  border-color:var(--line);
}

.results{display:none}.results.show{display:block}
.result-title{font-size:24px;font-weight:850;margin-bottom:4px;color:var(--text)}
.result-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.score-card{
  border:1px solid var(--line);
  background:var(--steel);
  color:var(--text);
  border-radius:14px;
  padding:16px;
}
.score-row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.score-name{font-weight:800;color:var(--cloudy)}
.score-val{font-weight:850;color:var(--azure)}
.bar{height:7px;background:var(--graphite);border-radius:999px;overflow:hidden;margin:10px 0}
.bar span{display:block;height:100%;background:var(--mint)}
.band{font-size:12px;color:var(--muted)}
.facets{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:7px}
.facet{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.facet strong{color:var(--azure)}
.top3{display:grid;gap:12px;margin:18px 0}
.top-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--steel);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
}
.rank{font-weight:900;font-size:13px;color:var(--cloudy)}
.top-name{font-size:20px;font-weight:850;color:var(--azure)}
.blend{font-weight:850;color:var(--mint)}
.footer-note{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.5}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

@media(max-width:640px){
  .app{padding:18px 12px 36px}
  .card{padding:20px 16px}
  .question{font-size:21px}
  .test-head{display:block}
  .tab{padding:10px 13px}
}
</style>
</head>

function band(p){return p<20?"Very low":p<40?"Low":p<60?"Moderate":p<80?"High":"Very high";}
function scoreItem(v,key){return key===1?v:6-v;}
function scoreTest(id){
 const items=DATA[id], ans=state[id].answers, groups={};
 for(let i=0;i<items.length;i++){
  const it=items[i], v=ans[i]; if(!v) continue;
  const s=scoreItem(v,it.key);
  if(!groups[it.domain]) groups[it.domain]={vals:[],facets:{}};

  for(const [f,vs] of Object.entries(g.facets)){
